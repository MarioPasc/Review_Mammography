# NCBI Search Parameters Configuration

# List of keywords to search for in title or abstract
keywords:
  - "DDSM"
  - "deep learning"
  - "convolutional neural network"

# Date range in YYYY/MM/DD format
date_range:
  start_date: "2020/01/01"
  end_date: "2025/12/31"

# Your email for NCBI API access
email: "mpascual@uma.es"

# Optional parameters
database: "pubmed"  # Default: "pubmed"; alternatives: "pmc", etc.
max_results: 10     # Default: 100
output_prefix: "data/ncbi_results"  # Output files will be ncbi_results.csv and ncbi_results_metadata.txt
free_full_text: True  # Default: False; set to True to include free full-text articles