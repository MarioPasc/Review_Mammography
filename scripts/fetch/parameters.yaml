# NCBI Search Parameters Configuration using keyword sets

# Keyword sets - each inner list is a distinct set (combined with AND between sets)
keyword_sets:
  - # Dataset terms
    - "DDSM"
    - "Digital Database for Screening Mammography (DDSM)"
    - "CBIS-DDSM"
    - "Curated Breast Imaging Subset of DDSM"
    - "MIAS"
    - "Mammographic Image Analysis Society database"
    - "BancoWeb"
    - "LAPIMO"
    - "Online Mammographic Images Database"
    - "UCSF"
    - "LLNL"
    - "UCSF/LLNL High Resolution Digital Mammogram Library"
    - "INbreast"
    - "VinDr-Mammo"
    - "CMMD"
    - "Chinese Mammography Database"
    - "RSNA"
    - "RSNA Screening Mammography Breast Cancer Detection"
    - "OPTIMAM"
    - "OPTIMAM Mammography Image Database"
    - "CSAW"
    - "Cohort of Screen-Aged Women"
    - "EMBED"
    - "EMory BrEast imaging Dataset"
    - "ADMANI"
    - "Annotated Digital Mammograms and Associated Non-Image Datasets"
    - "BCDR"
    - "Breast Cancer Digital Repository"
    - "BCDR-FM"
    - "BCDR-DM"
  - # AI terms
    - "deep learning"
    - "convolutional neural network"
    - "neural network"
    - "artificial neural network"
    - "deep neural network"
    - "computer vision"
    - "machine learning"
    - "artificial intelligence"
    - "CNN"
    - "NN"
    - "DL"
    - "ML"
    - "segmentation"
    - "detection"
    - "classification"
    - "localization"
  - # Medical terms
    - "mammography"
    - "breast cancer"
    - "breast imaging"
    - "screening mammography"
    - "digital mammography"
    - "BC"
    

arxiv_categories:
  - "cs.CV"  # Computer Vision
  - "cs.LG"  # Machine Learning
  - "eess.IV"  # Image and Video Processing
  - "stat.ML"  # Statistics - Machine Learning

# Semantic Scholar specific parameters
semantic_scholar_api_key: ""  # Optional: Add your API key if you have one

semantic_scholar_publication_types:
  - "JournalArticle"
  
semantic_scholar_fields_of_study:
  - "Computer Science"
  - "Engineering"
  - "Mathematics"

semantic_scholar_min_citation_count: 5
semantic_scholar_open_access_only: true
semantic_scholar_sort: "citationCount:desc"  # Options: citationCount:desc, publicationDate:desc, etc.

# Date range in YYYY/MM/DD format
date_range:
  start_date: "2020/01/01"
  end_date: "2025/12/31"

# Your email for NCBI API access
email: "mpascual@uma.es"

# Optional parameters
database: "pubmed"
max_results: 500
output_prefix: "data/ncbi_results"

# Additional filters
free_full_text: true

# Keywords to exclude
exclude_keywords: ["systematic review", "meta-analysis", "review", "meta-analysis", "mri"]